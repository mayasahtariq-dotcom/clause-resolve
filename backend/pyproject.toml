[project]
name = "clauselens"
version = "0.1.0"
description = "ClauseLens: evidence-backed comparison of subscription, refund and cancellation policies"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
celery = ["celery[redis]>=5.4,<6"]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "celery[redis]>=5.4,<6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clauselens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a reachable PostgreSQL (TEST_DATABASE_URL)",
    "redis: requires a reachable Redis (TEST_REDIS_URL)",
    "live: calls real paid providers; needs credentials and network",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"clauselens/adapters/fixture_data.py" = ["E501"]  # verbatim demo page text

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
